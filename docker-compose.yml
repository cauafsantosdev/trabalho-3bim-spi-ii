x-db-cliente: &db-cliente
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: spi
  DB_USER: spi
  DB_PASSWORD: ${POSTGRES_PASSWORD:-spi}

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: spi
      POSTGRES_USER: spi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spi}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spi -d spi"]
      interval: 5s
      timeout: 5s
      retries: 10

  importador:
    build: ./db
    environment: *db-cliente
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      <<: *db-cliente
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-8}"
      MAX_CONCURRENT_REQUESTS: "${MAX_CONCURRENT_REQUESTS:-20}"
      CONCURRENCY_TIMEOUT_MS: "${CONCURRENCY_TIMEOUT_MS:-250}"
    ports:
      - "8000:8000"
    depends_on:
      importador:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
